readme = "README.md"
authors = [
    { name = "Uladnik", email = "vladmelnik1993@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.10",
    "fastapi>=0.162.7",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "optuna>=5.0.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
