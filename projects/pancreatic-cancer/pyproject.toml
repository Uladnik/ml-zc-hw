[project]
name = "pancreatic-cancer"
version = "0.1.0"
description = "Risk prediction model for pancreatic cancer"
readme = "README.md"
authors = [
    { name = "Uladnik", email = "vladmelnik1993@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.10",
    "fastapi>=0.163.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn>=0.54.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "optuna>=5.0.0",
    "requests>=2.34.2",
]
